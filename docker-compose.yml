services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:5173}
    # Uncomment if you have a real Google Calendar service account key and need
    # calendar-backed tools/burnout_monitor — not required to boot the API itself.
    # volumes:
    #   - ./src/epars_agent/agent/sa_key.json:/app/src/epars_agent/agent/sa_key.json:ro
